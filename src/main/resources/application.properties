spring.application.name=fiel

# Banco: os padrões apontam para o Postgres de desenvolvimento (docker compose up -d, porta 5436).
# Em produção os três vêm do ambiente.
spring.datasource.url=${FIEL_BANCO_URL:jdbc:postgresql://localhost:5436/fiel}
spring.datasource.username=${FIEL_BANCO_USUARIO:fiel}
spring.datasource.password=${FIEL_BANCO_SENHA:fiel}
# Esperar no máximo 5 s por uma conexão livre: melhor um erro rápido do que pedidos presos
spring.datasource.hikari.connection-timeout=5000

# Flyway aplica as migrações de db/migration na partida e recusa banco com migração alterada
# (já é o padrão; fica explícito)
spring.flyway.validate-on-migrate=true

# Erros no formato padrão RFC 9457 (application/problem+json), inclusive o 404
spring.mvc.problemdetails.enabled=true
# Nunca mandar o rastro de pilha na resposta (já é o padrão; fica explícito)
server.error.include-stacktrace=never

server.port=${FIEL_PORTA:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
