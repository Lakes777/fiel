spring.application.name=fiel

# Banco: os padrões apontam para o Postgres de desenvolvimento (docker compose up -d, porta 5436).
# Em produção os três vêm do ambiente.
spring.datasource.url=${FIEL_BANCO_URL:jdbc:postgresql://localhost:5436/fiel}
spring.datasource.username=${FIEL_BANCO_USUARIO:fiel}
spring.datasource.password=${FIEL_BANCO_SENHA:fiel}
# Esperar no máximo 5 s por uma conexão livre: melhor um erro rápido do que pedidos presos
spring.datasource.hikari.connection-timeout=5000

# Flyway aplica as migrações de db/migration na partida e recusa banco com migração alterada
# (já é o padrão; fica explícito)
spring.flyway.validate-on-migrate=true
# Usuário da API sem poder de dono (V8). Vazio no desenvolvimento: a API usa o próprio dono.
spring.flyway.placeholders.papel_api=${FIEL_BANCO_PAPEL_API:}
# Em produção as migrações rodam à parte, com o dono (Migrar.kt), e a API parte com isto em false:
# a senha do dono nunca entra no contêiner da API
spring.flyway.enabled=${FIEL_MIGRAR_NA_PARTIDA:true}

# Erros no formato padrão RFC 9457 (application/problem+json), inclusive o 404
spring.mvc.problemdetails.enabled=true
# Nunca mandar o rastro de pilha na resposta (já é o padrão; fica explícito)
server.error.include-stacktrace=never

server.port=${FIEL_PORTA:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Sessões de login no Postgres (tabelas da migração V3; o Spring não cria nada sozinho)
spring.session.jdbc.initialize-schema=never
# Sessão parada há 15 min acaba, como em app de banco
server.servlet.session.timeout=15m
# Cookie da sessão: o JavaScript não lê, outro site não manda, e só viaja por HTTPS.
# O navegador aceita cookie seguro em http://localhost; só os testes (cliente HTTP comum) desligam.
server.servlet.session.cookie.name=FIEL_SESSAO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

# Duas threads para as tarefas agendadas: uma entrega de aviso lenta não segura a expiração das cobranças.
# Enquanto a conciliação noturna roda (varre o banco inteiro), expiração e entrega dividem a outra.
spring.task.scheduling.pool.size=2

# Conciliação noturna (3h de Brasília) com o resultado no Telegram. Sem token e chat, fica só no log.
fiel.telegram.token=${FIEL_TELEGRAM_TOKEN:}
fiel.telegram.chat=${FIEL_TELEGRAM_CHAT:}
