<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1c18" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fiel: pagamentos onde a conta sempre fecha. Carteira, transferências e cobranças com QR, com dinheiro de mentira." />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <title>Fiel</title>
    <script>
      // Antes de pintar: o tema salvo (ou o do aparelho), sem piscar o claro no escuro
      try {
        var t = localStorage.getItem('fiel-tema');
        if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
